name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Libraries the desktop app links against on Linux: ALSA for sound,
  # udev for gamepads and xkbcommon/Wayland for the window.
  LINUX_PACKAGES: libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev

jobs:
  lint:
    name: Format, lint and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install --yes $LINUX_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- --deny warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: --deny warnings

  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes $LINUX_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  cpu-diagnostics:
    name: CPU diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/fetch-cpu-tests.sh
      - run: cargo test --release --package i8080 --test cpm -- --ignored --nocapture

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install --yes $LINUX_PACKAGES
      # The version is an input rather than the action's ref, which
      # dependabot would mistake for an action version to bump.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.85 check --workspace --all-targets

  web:
    name: Web frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: cargo clippy --package midway-racer-web --target wasm32-unknown-unknown -- --deny warnings
      - name: Build
        working-directory: web
        run: npm run build
      - name: Type-check, lint and check formatting
        working-directory: web
        run: npm run check
      - name: Test
        working-directory: web
        run: npm test
