name: Set up the web build
description: >-
  Installs Rust with the wasm32 target, the wasm-bindgen CLI matching the
  locked wasm-bindgen crate, Node.js and the frontend's npm dependencies.

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: clippy

    - uses: Swatinem/rust-cache@v2

    - id: wasm-bindgen
      name: Find the locked wasm-bindgen version
      shell: bash
      run: |
        version="$(cargo metadata --format-version 1 --locked \
          | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-bindgen-cli@${{ steps.wasm-bindgen.outputs.version }}

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install npm dependencies
      shell: bash
      working-directory: web
      run: npm ci
